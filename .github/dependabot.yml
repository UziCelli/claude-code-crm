version: 2
# Uma vez por mês. Atualizações pequenas (minor/patch) chegam juntas num PR só;
# o workflow dependabot-juntar.yml junta sozinho com tudo verde. Versão grande (major) vem em
# PR próprio e não é juntada: o Claude aponta o risco e avisa o Victor (ver AGENTS.md).
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      pequenas:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      pequenas:
        update-types: [minor, patch]
