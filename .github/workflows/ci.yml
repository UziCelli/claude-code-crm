name: CI

# Testes e vulnerabilidades das bibliotecas a cada mudança e toda segunda-feira (biblioteca nova com falha aparece sem ninguém mexer).
# Na segunda, vulnerabilidade vira uma Issue com @UziCelli.
on:
  push:
    branches: [main]
  pull_request:
    # Rascunho não roda (economia de minutos): roda ao sair do rascunho e a cada envio depois.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:

concurrency:
  group: repository-workflows
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  issues: write

jobs:
  testes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pip-audit
      - name: Testes
        run: python -m pytest -q
      - name: Vulnerabilidades das bibliotecas
        run: pip-audit -r requirements.txt
      - name: Abrir Issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titulo="🚨 CRM: testes ou bibliotecas com problema"
          existe=$(gh api --paginate "repos/${{ github.repository }}/issues?state=open&per_page=100" --jq ".[] | select(.pull_request | not) | select(.title == \"$titulo\") | .number" | head -1)
          [ -n "$existe" ] || gh api "repos/${{ github.repository }}/issues" -f title="$titulo" \
            -f body="A checagem semanal falhou: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Chame o Claude para ver."$'\n\n@UziCelli' > /dev/null
